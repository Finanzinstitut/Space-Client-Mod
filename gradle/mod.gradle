// The Fabric build for one Minecraft version under versions/<mc>. Its own
// gradle.properties says which game, which Fabric API and how the game is
// shipped; everything shared with the other loaders is in preprocess.gradle.

def mc = project.minecraft_version
def label = project.mc_label
def obfuscated = project.obfuscated.toBoolean()

apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

ext.loaderName = 'fabric'
// Fabric on 1.21.11 runs under intermediary names, so strings that name game
// members are translated at runtime through a table built from Loom's mappings
ext.namesFromLoom = obfuscated

version = "${rootProject.mod_version}-mc${label}"
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        // Up to 1.21.11 the game ships obfuscated: compiled against Mojang's
        // names, remapped to intermediary in the jar
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        // From 26.1 the game ships unobfuscated: nothing to map
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

apply from: rootProject.file('gradle/preprocess.gradle')

loom {
    runConfigs.configureEach {
        runDir = 'run'
    }
}
