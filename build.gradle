// The mod is built once per Minecraft version, from the one source tree in
// src/ - see gradle/mod.gradle and versions/<version>/gradle.properties.
// Both Loom flavours come from the same plugin: the remapping one for the
// obfuscated 1.21.11, the plain one for 26.1 and later.
plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
}
