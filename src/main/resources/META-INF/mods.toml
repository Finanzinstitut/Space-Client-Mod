# Forge's description of the mod. Only the Forge builds carry this file; the
# placeholder values are filled in per Minecraft version by gradle/preprocess.gradle.
modLoader="javafml"
loaderVersion="[0,)"
license="All Rights Reserved"
clientSideOnly=true

[[mods]]
modId="spaceclient"
version="${version}"
displayName="Space Client"
authors="Finanzinstitut"
description='''In-game HUD modules for Space Client.'''

[[mixins]]
config="spaceclient.mixins.json"

[[dependencies.spaceclient]]
modId="forge"
mandatory=true
versionRange="${loader_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.spaceclient]]
modId="minecraft"
mandatory=true
versionRange="${mc_range}"
ordering="NONE"
side="CLIENT"
