name: Build Space Client Mod

on:
  push:
    branches: [main]
    # A tag is what publishes. The build itself is unchanged - the same jar
    # that the artifact carries is the one that gets attached - so a release
    # can never be built from something other than what was tested.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # One jar per supported Minecraft version (versions/<mc>), all from
      # the one source tree through the preprocessor in buildSrc
      - name: Build
        run: gradle build --no-daemon --stacktrace

      # Space Client for Horizon (horizon/): the HUD as a WebAssembly mod for
      # the Rust rewrite of Minecraft, which runs no Java mods. Built with
      # Horizon's own tool, pinned to the same commit as the mod's SDK.
      - name: Set up Rust for the Horizon mod
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo-horizon-mod
        id: horizon-tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-071580e7160c6fdfdcdd3f0dedd84fde93b7b864

      - name: Install cargo-horizon-mod
        if: steps.horizon-tool.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 071580e7160c6fdfdcdd3f0dedd84fde93b7b864 cargo-horizon-mod

      - name: Build the Horizon mod
        working-directory: horizon
        run: |
          cargo test --lib
          cargo horizon-mod build
          cargo horizon-mod check target/horizon-mod/spaceclient.hmod

      - name: Read mod version
        id: version
        run: echo "value=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Collected into one folder. Each jar already carries its Minecraft
      # version in its name (spaceclient-<version>-mc<minecraft>.jar), which
      # is what the launcher matches an instance against without opening it.
      - name: Collect jars
        run: |
          mkdir -p dist
          cp versions/*/build/libs/spaceclient-${{ steps.version.outputs.value }}-mc*.jar dist/
          ls -la dist
          test "$(ls dist/*.jar | wc -l)" -eq "$(ls -d versions/*/ | wc -l)"
          cp horizon/target/horizon-mod/spaceclient.hmod dist/spaceclient-horizon.hmod

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: spaceclient-mod
          path: |
            dist/*.jar
            dist/*.hmod
          if-no-files-found: error

      # Two ways in, because a tag cannot always be pushed from outside: a
      # token scoped to one branch is refused on refs/tags. The release API
      # creates the tag itself, and the token inside a run is allowed to.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v.${{ steps.version.outputs.value }}
          # The commit this run built, not the repository's default branch.
          # Without it the new tag is created wherever main happens to be, so
          # checking out the tag gives source that never produced these jars -
          # which is the one thing a tag is for.
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.version.outputs.value }}
          files: |
            dist/*.jar
            dist/*.hmod
          fail_on_unmatched_files: true
