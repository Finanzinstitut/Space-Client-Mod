name: Build Space Client Mod

on:
  push:
    branches: [main]
    # A tag is what publishes. The build itself is unchanged - the same jar
    # that the artifact carries is the one that gets attached - so a release
    # can never be built from something other than what was tested.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: gradle build --no-daemon --stacktrace

      # From gradle.properties rather than from the tag. The file name Loom
      # writes comes from this value, so reading it here is the only way the
      # attached asset and the jar on disk cannot drift apart.
      - name: Read mod version
        id: version
        run: echo "value=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spaceclient-mod
          path: build/libs/*.jar
          if-no-files-found: warn

      # Named exactly, not globbed: build/libs also holds the sources jar, and
      # the launcher picks the first .jar it finds in a release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.value }}
          files: build/libs/spaceclient-${{ steps.version.outputs.value }}.jar
          fail_on_unmatched_files: true
