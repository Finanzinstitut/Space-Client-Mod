pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'spaceclient'

// One project per supported Minecraft version (full releases only) and mod
// loader: versions/<mc> is Fabric, versions/<mc>-neoforge and -forge the others
['1.21.11', '26.1', '26.2', '26.3'].each { mc ->
    ['', '-neoforge', '-forge'].each { loader ->
        include ":${mc}${loader}"
        project(":${mc}${loader}").projectDir = file("versions/${mc}${loader}")
    }
}
